<h1>Away mode</h1>
<p class="mu" style="margin:0">Go on holiday. Your agents keep working, a teammate covers urgent decisions, and nothing merges without you.</p>

function render(){const m=mate();
$('#hero').className='hero '+(away?'on':'off');
$('#hero').innerHTML=away?`<div><b>You’re away for ${dur}.</b><br><span>${m} covers urgent decisions. Agents keep working. ${mg?'Merging needs you or '+m.split(' ')[0]+'.':'Merging waits for you.'} Away for: ${time()}.</span></div><div class="ctl"><label>Teammate <select id="mt">${['Ada O.','Tobi K.','Kemi A.'].map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select></label><label>For <select id="du">${['1 hour','3 hours','Until tomorrow'].map(x=>`<option ${x===dur?'selected':''}>${x}</option>`).join('')}</select></label><label><input type="checkbox" id="mg" ${mg?'checked':''}> Let ${m.split(' ')[0]} merge too</label><button class="btn g" id="ff">Skip ahead 30 min</button><button class="btn" id="bk">I’m back</button></div>`
:`<div><b>Welcome back.</b><br><span>Away mode is off. Everything below is waiting for you now.</span></div><div class="ctl"><button class="btn" id="aw">Go away again</button></div>`;
$('#ag').innerHTML=Object.entries(ag).map(([k,a])=>{const st=a.s==='work'?['w','Working']:a.s==='wait'?['q','Waiting for '+m.split(' ')[0]]:a.s==='fin'?['w','Done']:a.s==='idle'?['s','Standing by']:['s','Fix ready'];
return`<div class="a"><div class="who"><span class="ag" style="background:${C[k]}">${ini(k)}</span>${k}<span class="stt ${st[0]}">${st[1]}</span></div><p>${a.s==='fin'?'Merged #'+a.id+'. Standing by for the next task.':a.s==='idle'?'Skipped #'+a.id+' safely. Standing by.':a.s==='done'?'Finished #'+a.id+'. Waiting for you to merge.':a.s==='wait'?'Needs an answer on #'+a.id+' before it can start.':'#'+a.id+' '+a.t}</p>${a.s==='work'?`<div class="pb"><i style="width:${a.p}%"></i></div><small class="mu">${a.p}% done</small>`:a.s==='fin'?'<small class="mu">Approved by your teammate.</small>':a.s==='idle'?'<small class="mu">Nothing was changed.</small>':a.s==='done'?'<small class="mu">Nothing ships until you approve.</small>':'<small class="mu">Paused until someone answers.</small>'}</div>`}).join('');
const L=[['ada',away?m.split(' ')[0]+' can decide now':'Waiting for you','Questions and requests to start work.'],['held','Held for you','Skips safely if time runs out.'],['gate',mg&&away?'🔒 Merge gate · you or '+m.split(' ')[0]:'🔒 Merge gate · only you',mg&&away?'Nothing ships unless one of you approves.':'Nothing ships while you’re away.']];
$('#ln').innerHTML=L.map(([k,h,s])=>`<div class="ln ${k==='gate'?'gate':''}"><h3>${h}</h3><div class="s">${s}</div>${items.filter(i=>i.lane===k).map(i=>`<div class="it"><b>${i.ag} ${i.tx}</b><small>#${i.id}${i.d!==undefined&&i.s==='open'?' · '+i.d+' min left':''}</small>${i.s==='mrg'?`<br><span class="tag d">Merged by ${i.by} (you allowed it)</span>`:''}${i.s==='open'&&i.lane==='gate'&&away&&mg?`<br><button class="btn g" style="margin-top:8px" data-m="${i.id}">Merge as ${m.split(' ')[0]} (demo)</button>`:''}${i.s==='dec'?`<br><span class="tag d">Decided by ${i.by}</span>`:i.s==='skip'?'<br><span class="tag k">Skipped safely · nothing changed</span>':''}${i.s==='open'&&i.lane==='ada'&&away?`<br><button class="btn g" style="margin-top:8px" data-a="${i.id}">Decide as ${m.split(' ')[0]} (demo)</button>`:''}</div>`).join('')||'<small class="mu">Nothing here.</small>'}</div>`).join('');
const n=f=>items.filter(f).length;
$('#nm').innerHTML=[[Object.values(ag).filter(a=>a.s==='work').length,'agents still working'],[n(i=>i.s==='dec'),'decided by '+m.split(' ')[0]],[n(i=>i.s==='skip'),'skipped safely'],[n(i=>i.lane==='gate'&&i.s==='open'),'waiting for your merge']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
$('#ft').innerHTML=Object.entries(stats).map(([k,t])=>`<span class="fa"><span class="fv" style="background:${C[k]}">${ini(k)}</span><div><b>${k} <i class="mo">$${t.e.toFixed(2)}</i> <small>(+$${t.d.toFixed(2)})</small></b><small>${t.b} bid${t.b===1?'':'s'} · ${t.c} comment${t.c===1?'':'s'}</small></div></span>`).join('');
const s=$('#sumc');s.hidden=!back;if(back)s.className='card sum',s.innerHTML=`<h2>While you were away</h2><ul>${back.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn" id="ok">Got it</button>`}
function step(){mins+=30;Object.entries(ag).forEach(([k,a])=>{if(a.s==='work'){a.p=Math.min(100,a.p+30);if(a.p>=100){a.s='done';stats[k].e+=5;stats[k].d=5;stats[k].c++;items.push({id:a.id,ag:k,lane:'gate',tx:'fix ready: '+a.t.toLowerCase(),s:'open'});toast(k+' finished #'+a.id+'. It waits at the merge gate for you.')}}});
items.forEach(i=>{if(i.d!==undefined&&i.s==='open'){i.d-=30;if(i.d<=0){i.s='skip';if(i.lane==='ada'&&ag[i.ag].s==='wait')ag[i.ag].s='idle';}}});render()}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);
if(g('#ff'))step();
if(g('[data-a]')){const i=items.find(x=>x.id==g('[data-a]').dataset.a);i.s='dec';i.by=mate().split(' ')[0];ag[i.ag].s='work';ag[i.ag].p=10;stats[i.ag].b++;toast(i.by+' answered #'+i.id+'. '+i.ag+' is back to work.');render()}
if(g('#bk')){const d=items.filter(i=>i.s==='dec'),k=items.filter(i=>i.s==='skip'),w=items.filter(i=>i.lane==='gate'&&i.s==='open'),h=items.filter(i=>i.s==='open'&&i.lane!=='gate');
back=[...items.filter(i=>i.s==='mrg').map(i=>`<b>${i.by}</b> merged #${i.id} for you, because you allowed it.`),...d.map(i=>`<b>${i.by}</b> answered #${i.id} for you.`),...k.map(i=>`#${i.id} was skipped safely. Nothing changed.`),...w.map(i=>`#${i.id} is ready and waiting for your merge.`),...h.map(i=>`#${i.id} is waiting for you now.`)];if(!back.length)back=['Nothing needed you while you were away.'];away=false;render();scrollTo(0,0)}
if(g('[data-m]')){const i=items.find(x=>x.id==g('[data-m]').dataset.m);i.s='mrg';i.by=mate().split(' ')[0];ag[i.ag].s='fin';toast(i.by+' merged #'+i.id+'. It will show in your summary.');render()}
if(g('#aw')){away=true;back=null;render()}
if(g('#ok')){back=null;render()}});
document.addEventListener('change',e=>{if(e.target.id==='mt')render();if(e.target.id==='mg'){mg=e.target.checked;render();toast(mg?mate().split(' ')[0]+' can now approve merges too. It’s off by default.':'Merging waits for you again.')}if(e.target.id==='du'){dur=e.target.value;render()}});
render();
</script></body></html>
