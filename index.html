const ag={Juno:{id:341,t:'Calendar shows the wrong day on Sundays',p:40,s:'work'},Pip:{id:346,t:'Reminder email wording',p:0,s:'wait'},Sage:{id:352,t:'Rename a settings label',p:70,s:'work'}};
const stats={Juno:{b:1,c:0,e:0,d:0},Pip:{b:0,c:1,e:0,d:0},Sage:{b:1,c:0,e:0,d:0}};
let items=[{id:346,ag:'Pip',lane:'ada',tx:'asks: should reminder emails say “today” or the date?',d:40,s:'open',why:'A question, so your teammate can answer it.'},{id:358,ag:'Sage',lane:'ada',tx:'wants to start: fix spacing in the footer',d:60,s:'open',why:'A small fix with low risk.'},{id:360,ag:'Pip',lane:'held',tx:'wants to start: change how times are saved',d:90,s:'open',why:'A bigger change, so it waits for you.'},{id:338,ag:'Juno',lane:'gate',tx:'fix ready: login page logo is blurry',s:'open',why:'Merging is yours to approve.'}];
function draft(){const a=['Hi '+fn()+'. Please answer #346 (either wording is fine) and approve #358. I’ve kept #360.','Hi '+fn()+'. Answer #346, approve #358, leave #360 for me.'][variant%2];return a+(cfg.mm?' You can merge if tests pass.':' Don’t merge anything.')}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4200)}
const left=()=>Math.max(0,dm()-mins),fmt=m=>m>=1440?Math.floor(m/1440)+' day'+(Math.floor(m/1440)>1?'s':'')+(Math.floor(m%1440/60)?' '+Math.floor(m%1440/60)+' h':''):(m>=60?Math.floor(m/60)+' h ':'')+(m%60?m%60+' min':m>=60?'':'0 min');
const retLine=()=>dm()>=1440?'You’ll be back on '+new Date(Date.now()+dm()*60000).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'.':'You’ll be back in '+fmt(dm())+'.';
function checkin(){const d=items.filter(i=>i.s==='dec'||i.s==='mrg').length,g=items.filter(i=>i.lane==='gate'&&i.s==='open').length;return`<section class="card"><h2>Daily check-in <span class="aib">✨ by Ziki</span></h2><p style="margin:6px 0 0">Day ${Math.floor(mins/1440)+1}: ${d} decision${d===1?'':'s'} made, ${g} fix${g===1?'':'es'} waiting at the merge gate, nothing urgent needs you.</p></section>`}
function render(){
$('#stp').innerHTML=['1 · Hand over','2 · While you’re away','3 · When you’re back'].map((x,i)=>`<div class="${i+1<step?'d':i+1===step?'c':''}">${i+1<step?'✓ ':''}${x}</div>`).join('');
$('#v').innerHTML=step===1?s1():step===2?s2():s3();
$('#ft').innerHTML=Object.entries(stats).map(([k,t])=>`<span class="fa"><span class="ag" style="background:${C[k]};border-radius:50%">${ini(k)}</span><div><b>${k} <i>$${t.e.toFixed(2)}</i> <small>(+$${t.d.toFixed(2)})</small></b><small>${t.b} bid${t.b===1?'':'s'} · ${t.c} comment${t.c===1?'':'s'}</small></div></span>`).join('')}
function s1(){if(cfg.backup===cfg.mate)cfg.backup=TM.find(x=>x[0]!==cfg.mate)[0];if(!edited)cfg.note=draft();const o=items.filter(i=>i.lane!=='gate');
return`<div class="two"><section class="card"><label class="l">How long will you be away?</label><div class="chips">${[...Object.keys(DM),'Other'].map(x=>`<button data-d="${x}" aria-pressed="${x===cfg.dur}">${x}</button>`).join('')}</div>${cfg.dur==='Other'?`<div class="row" style="margin-top:8px"><input type="number" id="on" min="1" max="60" value="${cfg.n}" aria-label="How long"><select id="ou" style="width:auto"><option ${cfg.u==='hours'?'selected':''}>hours</option><option ${cfg.u==='days'?'selected':''}>days</option></select></div>`:''}<p class="sm mu" id="rt" style="margin:8px 0 0">${retLine()}</p>
<label class="l" for="mt">Who covers urgent decisions?</label><select id="mt">${TM.map(x=>`<option value="${x[0]}" ${x[0]===cfg.mate?'selected':''}>${x[0]} · ${x[1]}</option>`).join('')}</select>
<p class="sm mu" style="margin:6px 0 0"><span class="aib">✨ Ziki suggests Ada</span> She is the fastest to answer.</p>
<div id="bkw" ${long()?'':'hidden'}><label class="l" for="bk2">Backup, if ${fn()} doesn’t answer in 3 hours</label><select id="bk2">${TM.filter(x=>x[0]!==cfg.mate).map(x=>`<option value="${x[0]}" ${x[0]===cfg.backup?'selected':''}>${x[0]} · ${x[1]}</option>`).join('')}</select></div>
<p style="margin:14px 0 0">${fn()} can answer questions and approve small fixes.</p>
<label class="ck"><input type="checkbox" id="mm" ${cfg.mm?'checked':''}><div><b>Let ${fn()} approve merges too</b><span>Off by default. Turn it on only for someone you fully trust.</span></div></label>${cfg.mm?`<p class="sm" style="margin:6px 0 0;color:var(--or)">${role(cfg.mate)==='developer'?fn()+' can read code, so merging is a reasonable choice.':fn()+' isn’t a developer. Choose someone who can read code if you allow merges.'}</p>`:''}
<label class="l" for="nt">Note for ${fn()} <span class="aib">✨ drafted by Ziki</span></label><textarea id="nt" rows="4">${cfg.note}</textarea>
<div class="row"><button class="btn ai s" id="dr">Draft again</button><span class="sp"></span><button class="btn" id="go">Start away mode</button></div></section>
<section class="card"><h2>How Ziki sorted your decisions</h2><p class="mu sm" style="margin:2px 0 8px">Nothing to set up. You can change any of it later.</p><div class="pv">${o.map(i=>`<div class="i"><b>${i.ag} ${i.tx}</b><small>#${i.id} · ${i.lane==='ada'?'goes to '+fn():'held for you'}</small><span class="aib" style="margin-top:4px">✨ ${i.why}</span></div>`).join('')}<div class="i"><b>🔒 Merging</b><small>${cfg.mm?fn()+' can approve merges.':'Only you can approve merges.'}</small></div></div></section></div>`}
function s2(){const st=a=>a.s==='work'?['w','Working']:a.s==='wait'?['q','Waiting for '+fn()]:a.s==='fin'?['w','Done']:a.s==='idle'?['s','Standing by']:['s','Fix ready'];
const L=[['ada',fn()+' can decide now','Questions and small fixes.'],['held','Held for you','Skips safely if time runs out.'],['gate',cfg.mm?'🔒 Merge gate · you or '+fn():'🔒 Merge gate · only you',cfg.mm?'Nothing ships unless one of you approves.':'Nothing ships while you’re away.']];
return`<div class="hero"><div><b>You’re away. Back in ${fmt(left())}.</b><br><span>${fn()} covers urgent decisions. Agents keep working. ${cfg.mm?'Merging needs you or '+fn()+'.':'Merging waits for you.'}${long()?' Waiting requests are held for you, not skipped.':''}</span></div><div class="row" style="margin:0"><button class="btn g s" id="ff">Skip 30 min</button><button class="btn g s" id="f2">Skip 2 hours</button><button class="btn g s" id="f3">Skip 1 day</button><button class="btn s" id="bk">I’m back</button></div></div>
${long()?checkin():''}<section class="card"><h2>Your agents right now</h2><div class="ag3">${Object.entries(ag).map(([k,a])=>{const x=st(a);return`<div class="a"><div class="who"><span class="ag" style="background:${C[k]}">${ini(k)}</span>${k}<span class="stt ${x[0]}">${x[1]}</span></div><p>${a.s==='fin'?'Merged #'+a.id+'. Standing by.':a.s==='idle'?'Skipped #'+a.id+' safely. Standing by.':a.s==='done'?'Finished #'+a.id+'. Waiting at the merge gate.':a.s==='wait'?'Needs an answer on #'+a.id+' first.':'#'+a.id+' '+a.t}</p>${a.s==='work'?`<div class="pb"><i style="width:${a.p}%"></i></div><small class="mu">${a.p}% done</small>`:'<small class="mu">Nothing ships without approval.</small>'}</div>`}).join('')}</div></section>
<section class="card"><h2>Where each decision goes <span class="aib">✨ sorted by Ziki</span></h2><div class="lanes">${L.map(([k,h,s])=>`<div class="ln"><h3>${h}</h3><div class="s">${s}</div>${k==='ada'&&cfg.note?`<div class="nt">📝 <b>Your note:</b> ${cfg.note.replace(/</g,'&lt;')}</div>`:''}${items.filter(i=>i.lane===k).map(i=>`<div class="it"><b>${i.ag} ${i.tx}</b><small>#${i.id}${i.d!==undefined&&i.s==='open'?(long()&&i.lane==='held'?' · held until you’re back':' · '+i.d+' min left'):''}${i.bk&&i.s==='open'?' · passed to backup '+bfn():''}</small><div class="why">✨ ${i.why}</div>${i.s==='dec'?`<span class="tag d">Decided by ${i.by}</span>`:i.s==='skip'?'<span class="tag k">Skipped safely</span>':i.s==='mrg'?`<span class="tag d">Merged by ${i.by}</span>`:''}${i.s==='open'&&k==='ada'?`<button class="btn g s" style="margin-top:8px" data-a="${i.id}">Decide as ${i.bk?bfn():fn()} (demo)</button>`:''}${i.s==='open'&&k==='gate'&&cfg.mm?`<button class="btn g s" style="margin-top:8px" data-m="${i.id}">Merge as ${fn()} (demo)</button>`:''}</div>`).join('')||'<small class="mu">Nothing here.</small>'}</div>`).join('')}</div></section>`}
function s3(){const g=items.filter(i=>i.lane==='gate'&&i.s==='open'),h=items.filter(i=>i.lane!=='gate'&&i.s==='open');
return`<section class="card sum"><h2>Welcome back <span class="aib">✨ summary by Ziki</span></h2><p>${back.para}</p><ul style="margin:8px 0 0;padding-left:20px">${back.list.map(x=>`<li>${x}</li>`).join('')}</ul></section>
<section class="card"><h2>Next for you <span class="aib">✨ most important first</span></h2>${g.map(i=>`<div class="act"><span><b>${i.ag}</b> ${i.tx} (#${i.id})<small>Ready to ship and waiting the longest.</small></span><button class="btn s" data-me="${i.id}">Review and merge</button></div>`).join('')}${h.map(i=>`<div class="act"><span><b>${i.ag}</b> ${i.tx} (#${i.id})<small>${i.why}</small></span><button class="btn g s" data-hd="${i.id}">Decide now</button></div>`).join('')}${g.length+h.length?'':'<p class="mu sm" style="margin:6px 0 0">You’re all caught up.</p>'}<div class="row"><button class="btn g" id="rs">Plan another trip</button></div></section>`}
function summary(){const d=items.filter(i=>i.s==='dec'),k=items.filter(i=>i.s==='skip'),m=items.filter(i=>i.s==='mrg'),w=items.filter(i=>i.s==='open'),wk=Object.values(ag).filter(a=>a.s==='work').length,fin=Object.values(ag).filter(a=>a.s==='done'||a.s==='fin').length;
const qs=d.filter(i=>i.tx.startsWith('asks')).length,sf=d.length-qs,ne=w.length;
const parts=[];if(qs)parts.push(`answered ${qs} question${qs>1?'s':''}`);if(sf)parts.push(`approved ${sf} small fix${sf>1?'es':''}`);if(m.length)parts.push(`merged ${m.length} fix${m.length>1?'es':''} for you`);
const para=`You were away for ${fmt(Math.min(mins,dm())||mins)}. ${parts.length?fn()+' '+parts.join(' and ')+'. ':''}${fin?fin+' agent'+(fin>1?'s':'')+' finished work. ':''}${k.length?k.length+' request'+(k.length>1?'s were':' was')+' skipped safely. ':''}${ne?(ne===1?'One thing needs':ne+' things need')+' you now.':'Nothing needs you now.'}`;
const list=[...m.map(i=>`<b>${i.by}</b> merged #${i.id} for you, because you allowed it.`),...d.map(i=>`<b>${i.by}</b> ${i.tx.startsWith('asks')?'answered':'approved'} #${i.id}.`),...k.map(i=>`#${i.id} was skipped safely. Nothing changed.`),...(long()&&w.length?[`${w.length} request${w.length>1?'s were':' was'} held for you, not skipped.`]:[]),`${wk} agent${wk===1?' is':'s are'} still working.`];return{para,list}}
function finish(auto){back=summary();step=3;render();scrollTo(0,0);if(auto)toast('Your away time is over. Welcome back.')}
function tick(n){for(let j=0;j<n&&step===2;j++){mins+=30;Object.entries(ag).forEach(([k,a])=>{if(a.s==='work'){a.p=Math.min(100,a.p+30);if(a.p>=100){a.s='done';stats[k].e+=5;stats[k].d=5;stats[k].c++;items.push({id:a.id,ag:k,lane:'gate',tx:'fix ready: '+a.t.toLowerCase(),s:'open',why:'Merging is yours to approve.'});toast(k+' finished #'+a.id+'. It waits at the merge gate.')}}});
items.forEach(i=>{if(i.d!==undefined&&i.s==='open'){if(long()&&i.lane==='held')return;i.d-=30;if(i.d<=0){if(long()&&i.lane==='ada'&&!i.bk){i.bk=1;i.d=180;return}i.s='skip';if(ag[i.ag].s==='wait'&&i.lane==='ada')ag[i.ag].s='idle'}}});if(mins>=dm()){finish(true);return}}render()}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);
if(g('[data-d]')){cfg.dur=g('[data-d]').dataset.d;render()}
if(g('#dr')){edited=false;variant++;render()}
if(g('#go')){cfg.note=$('#nt').value.trim();step=2;mins=0;render();scrollTo(0,0);toast('Away mode is on. '+fn()+' covers urgent decisions.')}
if(g('#ff'))tick(1);if(g('#f2'))tick(4);if(g('#f3'))tick(48);
if(g('[data-a]')){const i=items.find(x=>x.id==g('[data-a]').dataset.a);i.s='dec';i.by=i.bk?bfn():fn();stats[i.ag].b++;if(ag[i.ag].s==='wait'){ag[i.ag].s='work';ag[i.ag].p=10}toast(i.by+(i.tx.startsWith('asks')?' answered #':' approved #')+i.id+'.');render()}
if(g('[data-m]')){const i=items.find(x=>x.id==g('[data-m]').dataset.m);i.s='mrg';i.by=fn();ag[i.ag].s='fin';toast(fn()+' merged #'+i.id+'.');render()}
if(g('#bk'))finish(false);
if(g('[data-me]')){const i=items.find(x=>x.id==g('[data-me]').dataset.me);i.s='mrg';i.by='you';ag[i.ag].s='fin';toast('Merged #'+i.id+'.');back=summary();render()}
if(g('[data-hd]')){const i=items.find(x=>x.id==g('[data-hd]').dataset.hd);i.s='dec';i.by='you';toast('Done. #'+i.id+' is decided.');back=summary();render()}
if(g('#rs')){step=1;mins=0;edited=false;render()}});
document.addEventListener('change',e=>{if(e.target.id==='mt'){cfg.mate=e.target.value;render()}if(e.target.id==='mm'){cfg.mm=e.target.checked;render()}if(e.target.id==='ou'){cfg.u=e.target.value;render()}if(e.target.id==='bk2'){cfg.backup=e.target.value}});
document.addEventListener('input',e=>{if(e.target.id==='nt'){cfg.note=e.target.value;edited=true}if(e.target.id==='on'){cfg.n=e.target.value;$('#rt').textContent=retLine();$('#bkw').hidden=!long()}});
render();
</script></body></html>
